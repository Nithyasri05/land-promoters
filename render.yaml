services:
  - type: web
    name: land-promoters-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm run start:backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_LOCAL_PORT
        sync: false
      - key: NET_TOKEN
        sync: false
      - key: NET_EXPIRES_TIME
        value: 7d
      - key: COOKIES_EXPIERS_TIME
        value: 7
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 465
      - key: MAIL_SECURE
        value: true
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_RECEIVER
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: ADMIN_ALLOW_REGISTRATION
        value: false
